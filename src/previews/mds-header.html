<!--
  The navigation at every width: the stage is narrower than Magma's tablet
  breakpoint, where `nav="desktop"` hides it. On the bar too: mds-header sets
  `nav` on the bar as a property, which the bar does not write back on its
  attribute, the one its CSS reads
  (https://github.com/magma-design-system/magma/issues/1147).
-->
<mds-header nav="all">
  <mds-header-bar nav="all">
    <mds-img
      class="w-800"
      src="../../downloads/identity/internal/magma-design-system/logo-magma.svg"
      alt="Magma"
    ></mds-img>
    <mds-button
      slot="nav"
      id="servizi"
      label="Servizi"
      icon="mi/baseline/expand-more"
      icon-position="right"
      variant="dark"
      tone="text"
    ></mds-button>
    <mds-button slot="nav" label="Accedi" variant="primary" tone="strong"></mds-button>
  </mds-header-bar>

  <nav slot="menu" class="flex flex-col items-start gap-200 p-600">
    <mds-text typography="h6" tag="h2">Servizi</mds-text>
    <mds-button
      label="Pratiche edilizie"
      icon="mi/baseline/home-work"
      variant="dark"
      tone="text"
    ></mds-button>
    <mds-button label="Tributi" icon="mi/baseline/receipt" variant="dark" tone="text"></mds-button>
    <mds-button label="Anagrafe" icon="mi/baseline/badge" variant="dark" tone="text"></mds-button>
    <mds-button
      label="Assistenza"
      icon="mi/baseline/help-outline"
      variant="dark"
      tone="text"
    ></mds-button>
    <mds-button label="Accedi" variant="primary" tone="strong"></mds-button>
  </nav>
</mds-header>

<mds-dropdown target="#servizi">
  <mds-button
    label="Pratiche edilizie"
    icon="mi/baseline/home-work"
    variant="dark"
    tone="text"
  ></mds-button>
  <mds-button label="Tributi" icon="mi/baseline/receipt" variant="dark" tone="text"></mds-button>
  <mds-button label="Anagrafe" icon="mi/baseline/badge" variant="dark" tone="text"></mds-button>
</mds-dropdown>
