<mds-card class="max-w-xs">
  <mds-card-header>
    <mds-text typography="h6">Sala di lettura</mds-text>
  </mds-card-header>
  <mds-card-media>
    <mds-img
      src="../../previews/reading-room.webp"
      alt="Una sala di lettura con lunghi tavoli e scaffali di libri"
      class="object-cover"
    ></mds-img>
  </mds-card-media>
  <mds-card-content>
    <mds-text typography="detail">
      Prenota un posto nella sala di lettura: aperta dal luned&igrave; al sabato, dalle 9 alle 19.
    </mds-text>
  </mds-card-content>
  <mds-card-footer>
    <mds-button variant="dark" tone="text" label="Annulla"></mds-button>
    <mds-button variant="primary" tone="strong" label="Prenota"></mds-button>
  </mds-card-footer>
</mds-card>
