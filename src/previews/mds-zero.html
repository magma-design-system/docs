<mds-zero>

  <mds-text typography="h5" slot="content">Nessun elemento trovato</mds-text>
  <mds-text typography="detail" slot="content">
    Non ci sono elementi che corrispondono alla tua ricerca. Modifica i filtri o crea un nuovo
    elemento.

    variant="primary"
    tone="strong"
    size="lg"
  ></mds-button>
</mds-zero>
