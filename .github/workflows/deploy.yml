name: Deploy to GitHub Pages

# Pull requests to main are built and checked; what is merged into production
# (by a pull request from main) is published.
on:
  push:
    branches: [production]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whole history: page footers show who created each page (src/lib/history.ts).
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Type check
        run: npm ci && npm run check
      - name: Build
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm

  deploy:
    # Also a manual run publishes only from production: the github-pages
    # environment accepts no other branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
